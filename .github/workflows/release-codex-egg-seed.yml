name: Release Codex Egg Seed Beta

on:
  push:
    branches:
      - codex/pkhex-export
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish exact source commit
    runs-on: windows-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Windows x64 application
        shell: pwsh
        run: dotnet build 3DSRNGTool/3DSRNGTool.csproj --configuration Release --verbosity minimal

      - name: Run RNG regression tests
        shell: pwsh
        run: dotnet test Tests/3DSRNGTool.Tests.csproj --configuration Release --verbosity minimal

      - name: Package built application
        shell: pwsh
        run: |
          $source = "3DSRNGTool/bin/Release/net10.0-windows/win-x64"
          if (!(Test-Path "$source/3DSRNGTool.exe")) { throw "Missing built EXE" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$source/*" -DestinationPath "dist/3DSRNGTool-codex-pkhex-export-win-x64-beta.zip" -CompressionLevel Optimal
          if (!(Test-Path "dist/3DSRNGTool-codex-pkhex-export-win-x64-beta.zip")) { throw "Missing ZIP" }

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          ## Gen6 egg Seed beta (codex/pkhex-export)

          Source: ${{ github.sha }} (built and tested by this workflow).
          Requires Windows x64 and .NET 10 Windows Desktop Runtime.

          - Modifying Gen6 egg Seed [1]/[0] invalidates old search results.
          - Recalculate in current egg mode to see only -1/Current from the 64-bit egg Key.
          - Future-frame hits originate from the independent top main MT Seed.
          - Masuda Method plus Shiny Charm PID remains derived from the egg Key.
          - RNG regression tests include the exact screenshot's high/low egg Key.
          '@ | Set-Content -Path release-notes.md -Encoding utf8

      - name: Publish source-specific prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $tag = "v1.0.6-codex-egg-seed-beta.$($sha.Substring(0, 8))"
          gh release create $tag "dist/3DSRNGTool-codex-pkhex-export-win-x64-beta.zip" --repo "${{ github.repository }}" --target $sha --title "3DSRNGTool egg Seed beta $($sha.Substring(0, 8))" --notes-file "release-notes.md" --prerelease
