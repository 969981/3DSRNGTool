name: CI

on: [pull_request, push]

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build 3DSRNGTool
        run: dotnet build 3DSRNGTool/3DSRNGTool.csproj --configuration Release --verbosity minimal

      - name: Run regression tests
        run: dotnet test Tests/3DSRNGTool.Tests.csproj --configuration Release --verbosity minimal

      - name: Package 3DSRNGTool
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path upload/3DSRNGTool | Out-Null
          Copy-Item -Path 3DSRNGTool/bin/Release/net10.0-windows/win-x64/* -Destination upload/3DSRNGTool -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3DSRNGTool-codex-pkhex-export
          path: upload/3DSRNGTool
